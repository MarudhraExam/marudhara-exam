<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - मरुधरा एग्जाम</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fa;
margin:0;
padding:0;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px;
flex-wrap:wrap;
gap:10px;
}

h1{
color:#002B5B;
font-size:20px;
margin:0;
}

.q-counter{
background:#002B5B;
color:white;
padding:6px 14px;
border-radius:20px;
font-size:14px;
font-weight:bold;
}

.progress-bar{
background:#e2e6ee;
border-radius:10px;
height:8px;
margin-bottom:20px;
overflow:hidden;
}

.progress-fill{
background:#FF8C00;
height:100%;
width:0%;
transition:width .2s ease;
}

.q-card{
background:white;
border-radius:14px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
padding:24px;
margin-bottom:20px;
}

.q-text-hi{
font-size:18px;
color:#002B5B;
font-weight:bold;
margin-bottom:6px;
line-height:1.6;
}

.q-text-en{
font-size:15px;
color:#555;
margin-bottom:20px;
line-height:1.5;
font-style:italic;
}

.option{
display:flex;
align-items:flex-start;
gap:10px;
border:2px solid #e2e6ee;
border-radius:10px;
padding:12px 14px;
margin-bottom:12px;
cursor:pointer;
transition:.15s ease;
}

.option:hover{
border-color:#FF8C00;
}

.option.selected{
border-color:#002B5B;
background:#eef3fb;
}

.option .opt-label{
font-weight:bold;
color:#002B5B;
min-width:20px;
}

.option .opt-text-hi{
color:#222;
}

.option .opt-text-en{
color:#777;
font-size:13px;
font-style:italic;
}

.nav-buttons{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:30px;
}

.nav-buttons button{
flex:1;
padding:13px;
border:none;
border-radius:10px;
font-size:15px;
cursor:pointer;
font-weight:bold;
}

.btn-prev{
background:#e2e6ee;
color:#333;
}

.btn-next{
background:#002B5B;
color:white;
}

.btn-submit{
background:#FF8C00;
color:white;
}

.btn-prev:disabled{
opacity:.5;
cursor:not-allowed;
}

.quiz-state-msg{
text-align:center;
color:#666;
padding:30px 10px;
font-size:15px;
}

</style>
</head>

<body>

<div class="container">

<div class="top-bar">
<h1 id="topicTitle">📁 Loading...</h1>
<div class="q-counter" id="qCounter">-</div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div id="quizArea">
<p class="quiz-state-msg">Loading questions...</p>
</div>

</div>

<script type="module">
import { fetchQuestions, optionText, getParam, escapeHtml } from "./quiz-common.js";

const subjectId = getParam("subject");
const subjectName = getParam("subjectName") || "Subject";
const topicId = getParam("topic");
const topicName = getParam("name") || "Topic";

document.getElementById("topicTitle").textContent = "📁 " + topicName;
document.title = topicName + " Quiz | मरुधरा एग्जाम";

const quizArea = document.getElementById("quizArea");
const qCounter = document.getElementById("qCounter");
const progressFill = document.getElementById("progressFill");

let questions = [];
let current = 0;
let answers = {}; // index -> "A"/"B"/"C"/"D"

function render() {
  if (questions.length === 0) return;

  const q = questions[current];
  const selected = answers[current];

  qCounter.textContent = `Q ${current + 1} / ${questions.length}`;
  progressFill.style.width = `${((current + 1) / questions.length) * 100}%`;

  const optionsHtml = ["A", "B", "C", "D"].map((key) => {
    const hi = optionText(q, key, "hi");
    const en = optionText(q, key, "en");
    if (!hi && !en) return "";
    return `
      <div class="option ${selected === key ? "selected" : ""}" data-key="${key}">
        <div class="opt-label">${key}.</div>
        <div>
          <div class="opt-text-hi">${escapeHtml(hi)}</div>
          ${en ? `<div class="opt-text-en">${escapeHtml(en)}</div>` : ""}
        </div>
      </div>
    `;
  }).join("");

  quizArea.innerHTML = `
    <div class="q-card">
      <div class="q-text-hi">${current + 1}. ${escapeHtml(q.qHi || "")}</div>
      ${q.qEn ? `<div class="q-text-en">${escapeHtml(q.qEn)}</div>` : ""}
      ${optionsHtml}
    </div>
    <div class="nav-buttons">
      <button class="btn-prev" id="prevBtn" ${current === 0 ? "disabled" : ""}>⬅ Previous</button>
      ${current === questions.length - 1
        ? `<button class="btn-submit" id="submitBtn">✅ Submit Quiz</button>`
        : `<button class="btn-next" id="nextBtn">Next ➡</button>`}
    </div>
  `;

  quizArea.querySelectorAll(".option").forEach((el) => {
    el.addEventListener("click", () => {
      answers[current] = el.getAttribute("data-key");
      render();
    });
  });

  const prevBtn = document.getElementById("prevBtn");
  if (prevBtn) prevBtn.addEventListener("click", () => { current--; render(); });

  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) nextBtn.addEventListener("click", () => { current++; render(); });

  const submitBtn = document.getElementById("submitBtn");
  if (submitBtn) submitBtn.addEventListener("click", submitQuiz);
}

function submitQuiz() {
  if (!confirm("क्या आप क्विज़ सबमिट करना चाहते हैं?")) return;

  let correct = 0, wrong = 0, skipped = 0;

  const details = questions.map((q, i) => {
    const selected = answers[i] || null;
    const isCorrect = selected && selected === q.correct;
    if (!selected) skipped++;
    else if (isCorrect) correct++;
    else wrong++;

    return {
      qHi: q.qHi, qEn: q.qEn,
      aHi: q.aHi, aEn: q.aEn, bHi: q.bHi, bEn: q.bEn,
      cHi: q.cHi, cEn: q.cEn, dHi: q.dHi, dEn: q.dEn,
      correct: q.correct,
      explHi: q.explHi, explEn: q.explEn,
      selected, isCorrect: !!isCorrect
    };
  });

  const attempted = correct + wrong;
  const total = questions.length;
  const percentage = total > 0 ? Math.round((correct / total) * 10000) / 100 : 0;

  const result = {
    subjectId, subjectName, topicId, topicName,
    total, attempted, correct, wrong, skipped,
    score: correct, percentage,
    details
  };

  sessionStorage.setItem("quizResult", JSON.stringify(result));
  window.location.href = `quiz-result.html?subject=${encodeURIComponent(subjectId)}&subjectName=${encodeURIComponent(subjectName)}&topic=${encodeURIComponent(topicId)}&name=${encodeURIComponent(topicName)}`;
}

(async () => {
  if (!topicId) {
    quizArea.innerHTML = '<p class="quiz-state-msg">टॉपिक नहीं मिला। कृपया वापस जाएं।</p>';
    return;
  }

  try {
    questions = await fetchQuestions(topicId);
    answers = {};
    current = 0;

    if (questions.length === 0) {
      quizArea.innerHTML = '<p class="quiz-state-msg">इस टॉपिक में अभी कोई प्रश्न उपलब्ध नहीं है।</p>';
      return;
    }

    render();
  } catch (err) {
    console.error(err);
    quizArea.innerHTML = '<p class="quiz-state-msg">प्रश्न लोड करने में समस्या हुई। कृपया पेज रीफ्रेश करें।</p>';
  }
})();
</script>

</body>
</html>
