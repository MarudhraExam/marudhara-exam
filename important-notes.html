<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Notes | मरुधरा एग्जाम</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:15px;
}
h1{
text-align:center;
font-size:32px;
}

.card-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:16px;
justify-content:center;
max-width:1100px;
margin:0 auto;
}

@media (min-width:600px){
.card-grid{
grid-template-columns:repeat(3,1fr);
gap:18px;
}
}

@media (min-width:900px){
.card-grid{
grid-template-columns:repeat(4,1fr);
gap:20px;
}
}

.card{
background:#fff;
border-radius:18px;
padding:18px 12px;
text-align:center;
cursor:pointer;
box-shadow:0 2px 10px rgba(0,0,0,.1);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:8px;
height:170px;
box-sizing:border-box;
transition:transform .15s ease, box-shadow .15s ease;
}

.card:hover{
box-shadow:0 4px 16px rgba(0,0,0,.15);
transform:translateY(-2px);
}

.card img{
width:76px;
height:76px;
object-fit:contain;
margin:auto;
display:block;
}

.card h3{
margin:4px 0 0;
font-size:15px;
color:#222;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
line-height:1.3;
min-height:2.6em;
}

.card p{
margin:0;
font-size:13px;
color:#003366;
font-weight:bold;
}

.back-btn{
padding:10px 15px;
margin-bottom:20px;
cursor:pointer;
}

.folder-list{
display:flex;
flex-direction:column;
gap:12px;
max-width:500px;
margin:0 auto;
}

.folder-item{
display:flex;
align-items:center;
gap:12px;
padding:16px;
background:white;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
cursor:pointer;
user-select:none;
}

.folder-item:hover{
background:#fff8e6;
}

.folder-item .folder-icon{
font-size:28px;
line-height:1;
flex-shrink:0;
}

.folder-item h3{
margin:0;
font-size:18px;
color:#333;
}

.pdf-box{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
max-width:500px;
margin-left:auto;
margin-right:auto;
}

.pdf-box p{
display:flex;
align-items:center;
gap:8px;
}

.open-btn{
display:inline-block;
padding:8px 15px;
background:#003366;
color:white;
text-decoration:none;
border-radius:6px;
}
</style>
</head>
<body>

<h1>📚 Important Notes</h1>
<div id="notesContainer"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyDHe87UG-QGy2Kxh7RI8t51qOGgppVd_YA",
 authDomain:"marudhara-exam.firebaseapp.com",
 projectId:"marudhara-exam",
 storageBucket:"marudhara-exam.firebasestorage.app",
 messagingSenderId:"680152404373",
 appId:"1:680152404373:web:32f4dcb9e16c525d33669c",
 measurementId: "G-8PVKGVQ74F"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let categories = {};
let subjects = {};

window.loadNotes = async function(){

categories = {};
subjects = {};

const categoriesSnap = await getDocs(collection(db,"notesCategories"));
const subjectsSnap = await getDocs(collection(db,"notesSubjects"));

categoriesSnap.forEach(doc=>{
 categories[doc.id] = doc.data();
});

subjectsSnap.forEach(doc=>{
 subjects[doc.id] = doc.data();
});

let html = '<div class="card-grid">';

// Sort categories by the optional "order" field:
// - Categories with a numeric order come first, ascending (1,2,3...).
// - Categories with missing/empty order come after, keeping their
//   existing relative order (no orderBy() query used, so old
//   documents without "order" are never excluded from the results).
const sortedCategoryIds = Object.keys(categories).sort((idA, idB)=>{

const orderA = categories[idA].order;
const orderB = categories[idB].order;

const hasA = typeof orderA === "number" && !isNaN(orderA);
const hasB = typeof orderB === "number" && !isNaN(orderB);

if(hasA && hasB) return orderA - orderB;
if(hasA && !hasB) return -1;
if(!hasA && hasB) return 1;
return 0;

});

for(const categoryId of sortedCategoryIds){

const category = categories[categoryId];

html += `
<div class="card" onclick="showSubjects('${categoryId}')">
<img src="${category.icon || ''}">
<h3>${category.name}</h3>
<p>Open →</p>
</div>
`;
}

html += '</div>';

document.getElementById("notesContainer").innerHTML = html;
}

window.showSubjects = async function(categoryId){

let html = `
<button class="back-btn" onclick="loadNotes()">⬅ Back</button>
<div class="card-grid">
`;

for(const subjectId in subjects){

const subject = subjects[subjectId];

if(subject.categoryId !== categoryId) continue;

html += `
<div class="card" onclick="showPdfs('${subjectId}')">
<img src="${subject.icon || ''}">
<h3>${subject.subjectName}</h3>
<p>Open →</p>
</div>
`;
}

html += '</div>';

document.getElementById("notesContainer").innerHTML = html;
}

let currentTopicsSnap = null;
let currentPdfsSnap = null;
let currentSubjectId = null;

// Inline onclick="" handlers run in the global scope, not inside this
// module, so module-scoped variables like `subjects` and `currentSubjectId`
// are not directly reachable from them (this caused the
// "subjects is not defined" error). This helper is exposed on window so
// it can be called from onclick, and it reads the existing module-scoped
// state internally, then reuses the existing showSubjects() function.
window.backToSubjectsFromPdfs = function(){
const subject = subjects[currentSubjectId];
showSubjects(subject ? subject.categoryId : undefined);
}

window.showPdfs = async function(subjectId){

const topicsSnap = await getDocs(collection(db,"notesTopics"));
const pdfsSnap = await getDocs(collection(db,"notesPdfs"));

currentTopicsSnap = topicsSnap;
currentPdfsSnap = pdfsSnap;
currentSubjectId = subjectId;

let html = `
<div style="display:flex;gap:10px;">
<button class="back-btn" onclick="loadNotes()">🏠 Home</button>
<button class="back-btn" onclick="backToSubjectsFromPdfs()">⬅ Back</button>
</div>
<h2>PDF Notes</h2>
<div class="folder-list">
`;

const topics = topicsSnap.docs.sort((a,b)=>{
    const n1 = parseInt(a.data().topicName.match(/\d+/)?.[0] || 0);
    const n2 = parseInt(b.data().topicName.match(/\d+/)?.[0] || 0);
    return n1 - n2;
});

topics.forEach(topicDoc=>{

const topic = topicDoc.data();

if(topic.subjectId !== subjectId) return;

html += `
<div class="folder-item" onclick="showTopicPdfs('${topicDoc.id}')">
<span class="folder-icon">📁</span>
<h3>${topic.topicName}</h3>
</div>
`;

});

html += '</div>';

document.getElementById("notesContainer").innerHTML = html;
}

window.showTopicPdfs = async function(topicId){

let topicsSnap = currentTopicsSnap;
let pdfsSnap = currentPdfsSnap;

if(!topicsSnap || !pdfsSnap){
topicsSnap = await getDocs(collection(db,"notesTopics"));
pdfsSnap = await getDocs(collection(db,"notesPdfs"));
}

const topicDoc = topicsSnap.docs.find(doc => doc.id === topicId);
const topic = topicDoc ? topicDoc.data() : {};

let html = `
<button class="back-btn" onclick="showPdfs('${currentSubjectId}')">⬅ Back</button>
<h2>${topic.topicName || ''}</h2>
<div class="pdf-box">
`;

const pdfs = pdfsSnap.docs
.filter(doc => doc.data().topicId === topicId)
.sort((a, b) => {
    const getNumber = (title) => {
        const match = (title || "").match(/\d+/);
        return match ? parseInt(match[0], 10) : Infinity;
    };

    return getNumber(a.data().noteTitle) - getNumber(b.data().noteTitle);
});

pdfs.forEach(pdfDoc => {

    const pdf = pdfDoc.data();

    html += `
    <p>📄 <b>${pdf.noteTitle}</b></p>
    <a href="${pdf.pdfLink}" target="_blank" class="open-btn">Open PDF</a>
    <hr>
    `;

});

html += `</div>`;

document.getElementById("notesContainer").innerHTML = html;
}

loadNotes();

</script>
</body>
</html>
