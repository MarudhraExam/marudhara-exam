<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Answers & Explanations | मरुधरा एग्जाम</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fa;
margin:0;
padding:0;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
flex-wrap:wrap;
gap:10px;
}

.back-btn{
background:#002B5B;
color:white;
border:none;
padding:9px 16px;
border-radius:8px;
cursor:pointer;
font-size:14px;
}

h1{
color:#002B5B;
font-size:20px;
margin:0;
}

.palette{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-bottom:22px;
}

.palette button{
width:38px;
height:38px;
border-radius:8px;
border:none;
font-weight:bold;
cursor:pointer;
font-size:14px;
color:white;
}

.palette button.pal-correct{ background:#1e8e3e; }
.palette button.pal-wrong{ background:#d93025; }
.palette button.pal-skipped{ background:#9e9e9e; }
.palette button.active{ outline:3px solid #FF8C00; }

.q-block{
background:white;
border-radius:14px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
padding:22px;
margin-bottom:18px;
scroll-margin-top:20px;
}

.q-block .q-text-hi{
font-size:17px;
color:#002B5B;
font-weight:bold;
margin-bottom:4px;
}

.q-block .q-text-en{
font-size:14px;
color:#666;
font-style:italic;
margin-bottom:16px;
}

.answer-row{
margin-bottom:10px;
padding:10px 12px;
border-radius:8px;
font-size:14px;
}

.answer-row .label{
font-weight:bold;
display:block;
margin-bottom:3px;
color:#555;
}

.your-answer.correct{ background:#e6f4ea; color:#1e8e3e; }
.your-answer.wrong{ background:#fce8e6; color:#d93025; }
.your-answer.skipped{ background:#f1f1f1; color:#666; }

.correct-answer{
background:#e6f4ea;
color:#1e8e3e;
}

.explanation-box{
background:#f5f7fa;
border-radius:8px;
padding:12px 14px;
margin-top:10px;
font-size:14px;
color:#333;
line-height:1.6;
}

.explanation-box .expl-label{
font-weight:bold;
color:#002B5B;
display:block;
margin-bottom:4px;
}

.quiz-state-msg{
text-align:center;
color:#666;
padding:30px 10px;
font-size:15px;
}

</style>
</head>

<body>

<div class="container">

<div class="top-bar">
<button class="back-btn" id="backTopicsBtn">⬅ Back to Topics</button>
<h1 id="pageTitle">📖 Answers &amp; Explanations</h1>
</div>

<div class="palette" id="palette"></div>

<div id="reviewList">
<p class="quiz-state-msg">Loading...</p>
</div>

</div>

<script type="module">
import { getParam, escapeHtml } from "./quiz-common.js";

const subjectId = getParam("subject");
const subjectName = getParam("subjectName") || "";
const topicId = getParam("topic");
const topicName = getParam("name") || "Topic";

document.getElementById("pageTitle").textContent = "📖 " + topicName + " - Answers";
document.title = topicName + " Answers | मरुधरा एग्जाम";

document.getElementById("backTopicsBtn").addEventListener("click", () => {
  window.location.href = `quiz-topics.html?subject=${encodeURIComponent(subjectId)}&name=${encodeURIComponent(subjectName)}`;
});

const raw = sessionStorage.getItem("quizResult");
const palette = document.getElementById("palette");
const list = document.getElementById("reviewList");

function optLabelText(q, key) {
  const map = {
    A: [q.aHi, q.aEn], B: [q.bHi, q.bEn], C: [q.cHi, q.cEn], D: [q.dHi, q.dEn]
  };
  const [hi, en] = map[key] || ["", ""];
  return `${key}. ${hi || ""}${en ? " / " + en : ""}`;
}

if (!raw) {
  list.innerHTML = '<p class="quiz-state-msg">रिजल्ट डेटा नहीं मिला। कृपया क्विज़ दोबारा शुरू करें।</p>';
} else {
  const r = JSON.parse(raw);

  palette.innerHTML = r.details.map((d, i) => {
    const cls = !d.selected ? "pal-skipped" : d.isCorrect ? "pal-correct" : "pal-wrong";
    return `<button class="${cls}" data-idx="${i}">${i + 1}</button>`;
  }).join("");

  list.innerHTML = r.details.map((d, i) => {
    const status = !d.selected ? "skipped" : d.isCorrect ? "correct" : "wrong";
    const yourAnswerText = d.selected
      ? optLabelText(d, d.selected) + (d.isCorrect ? " ✓" : " ✗")
      : "छोड़ा गया / Skipped";

    return `
      <div class="q-block" id="q-${i}">
        <div class="q-text-hi">Q${i + 1}. ${escapeHtml(d.qHi || "")}</div>
        ${d.qEn ? `<div class="q-text-en">${escapeHtml(d.qEn)}</div>` : ""}

        <div class="answer-row your-answer ${status}">
          <span class="label">आपका उत्तर / Your Answer:</span>
          ${escapeHtml(yourAnswerText)}
        </div>

        <div class="answer-row correct-answer">
          <span class="label">सही उत्तर / Correct Answer:</span>
          ${escapeHtml(optLabelText(d, d.correct))} ✓
        </div>

        ${d.explHi ? `
        <div class="explanation-box">
          <span class="expl-label">व्याख्या (Hindi):</span>
          ${escapeHtml(d.explHi)}
        </div>` : ""}

        ${d.explEn ? `
        <div class="explanation-box">
          <span class="expl-label">Explanation (English):</span>
          ${escapeHtml(d.explEn)}
        </div>` : ""}
      </div>
    `;
  }).join("");

  palette.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = btn.getAttribute("data-idx");
      document.getElementById(`q-${idx}`).scrollIntoView({ behavior: "smooth", block: "start" });
      palette.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
    });
  });
}
</script>

</body>
</html>
