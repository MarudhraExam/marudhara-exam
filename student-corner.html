<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Corner</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fa;
margin:0;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

h1{
text-align:center;
color:#002B5B;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:white;
padding:22px 12px;
border-radius:18px;
box-shadow:0 4px 14px rgba(0,0,0,0.08);
text-align:center;
cursor:pointer;
transition:.3s;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
height:170px;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.card .icon{
font-size:60px;
line-height:1;
margin-bottom:10px;
}

.card h2{
font-size:18px;
line-height:1.25;
margin:0 0 8px 0;
color:#002B5B;
font-weight:700;
display:flex;
align-items:center;
justify-content:center;
min-height:2.3em;
max-width:95%;
word-break:normal;
overflow-wrap:break-word;
}

.card p{
font-size:13px;
color:#555;
margin:0;
line-height:1.4;
max-width:90%;
}

@media (min-width:600px){
.grid{
grid-template-columns:repeat(3,1fr);
gap:20px;
}
.card{
padding:28px 20px;
height:200px;
}
.card .icon{
font-size:68px;
margin-bottom:12px;
}
.card h2{
font-size:22px;
}
.card p{
font-size:15px;
}
}

@media (min-width:900px){
.grid{
grid-template-columns:repeat(4,1fr);
}
.card{
height:210px;
}
.card .icon{
font-size:72px;
}
.card h2{
font-size:24px;
}
.card p{
font-size:16px;
}
}

</style>

</head>
<body>

<div class="container">

<h1>🎓 Student Corner</h1>

<div class="grid">

<div class="card"
onclick="location.href='typing/'">

<div class="icon">⌨️</div>
<h2>Typing Practice</h2>
<p>Hindi & English Typing Practice</p>

</div>

<div class="card"
onclick="location.href='daily-suja-sar.html'">

<div class="icon">📘</div>
<h2>Daily Sujas</h2>
<p>Daily Current Affairs PDF</p>

</div>

<div class="card"
onclick="location.href='downloads.html'">

<div class="icon">📥</div>
<h2>Downloads</h2>
<p>All Study Material</p>

</div>

<div class="card"
onclick="location.href='quiz-section.html'">

<div class="icon">📝</div>
<h2>Daily Quiz</h2>
<p>Daily Sujas Quiz Practice</p>

</div>
<div class="card"
onclick="location.href='important-notes.html'">

<div class="icon">📚</div>
<h2>Notes Shala</h2>
<p>Exam Oriented PDF Notes</p>

</div>
<div class="card"
onclick="location.href='monthly-sujas-mcq.html'">

<div class="icon">📗</div>
<h2>Monthly Sujas MCQ</h2>
<p>Month Wise MCQ PDF</p>

</div>
</div>

</div>

</body>
</html>
